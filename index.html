<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Trivia Quest</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        -webkit-video, video {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            object-fit: cover !important; z-index: 0 !important;
        }

        #game-hud {
            position: fixed;
            top: 10px; left: 10px; right: 10px;
            z-index: 9999 !important;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
        }
        .hud-card {
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            pointer-events: auto;
            border: 1px solid #334155;
        }
        #score-display { background: rgba(225, 29, 72, 0.95); }

        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
        }
        .modal-content {
            background-color: #1e293b;
            color: white;
            margin: 10% auto;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 2px solid #38bdf8;
        }

        .question-text {
            font-size: 1.1rem;
            margin: 15px 0;
            color: #f8fafc;
            line-height: 1.4;
        }

        .option-btn {
            background: #334155;
            color: white;
            border: 2px solid #38bdf8;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
            box-sizing: border-box;
        }
        .option-btn:active { background: #0284c7; }

        .modal-close-btn {
            background: #e11d48;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .error-text { color: #f87171; }
        .success-text { color: #4ade80; }
    </style>
</head>
<body>

    <div id="game-hud">
        <div class="hud-card" id="team-display">🏴‍☠️ Loading...</div>
        <div class="hud-card" id="progress-display">Markers: 0/20</div>
        <div class="hud-card" id="score-display">Points: 0</div>
    </div>

    <!-- Quiz & Notification Modal -->
    <div id="quizModal" class="modal">
        <div class="modal-content">
            <h3 id="markerBadge" style="color: #38bdf8; margin:0;">Marker Scanned!</h3>
            
            <div id="quizBody">
                <p id="questionText" class="question-text">Loading question...</p>
                <div id="optionsContainer"></div>
            </div>

            <div id="resultBody" style="display: none;">
                <h2 id="resultTitle"></h2>
                <p id="resultMessage" style="font-size: 1.1rem; margin: 15px 0;"></p>
                <button class="modal-close-btn" onclick="closeModal()">Continue Quest</button>
            </div>
        </div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; uiScanning: yes; uiLoading: yes;" 
        embedded 
        renderer="alpha: true; antialias: true; precision: medium;"
        color-space="sRGB"
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: true">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target-container"></a-entity>
    </a-scene>

    <script>
        const teamId = localStorage.getItem('team_id');
        const teamName = localStorage.getItem('team_name');
        
        // Validate teamId format (must be a valid UUID)
        const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
        if (!teamId || !teamName || !uuidRegex.test(teamId)) {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        const SUPABASE_URL = "https://vkdilynwfkkmmmjiyxyw.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrZGlseW53ZmtrbW1taml5eHl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDA5NDUsImV4cCI6MjA5Nzk3Njk0NX0.AY267mdl4i6fcJuqNx1J3ANs-mNRHcydZvwD75OuAA0";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('team-display').innerText = `🏴‍☠️ ${teamName}`;
        refreshHUD();

        let processingLock = false;
        let activeMarkerId = null;
        let currentQuestion = null;
        const container = document.getElementById('target-container');
        const TOTAL_MARKERS = 20; 

        // Bind target listeners for all 20 markers
        for (let i = 0; i < TOTAL_MARKERS; i++) {
            let entity = document.createElement('a-entity');
            entity.setAttribute('mindar-image-target', `targetIndex: ${i}`);
            let paddedId = (i + 1).toString().padStart(2, '0');

            entity.addEventListener('targetFound', async () => {
                if (processingLock) return;
                processingLock = true;
                activeMarkerId = paddedId;

                // Check if already scanned
                const { data: scanned, error } = await supabaseClient
                    .from('trivia_scans')
                    .select('id')
                    .eq('team_id', teamId)
                    .eq('marker_id', paddedId)
                    .maybeSingle();

                if (scanned) {
                    showAlreadyScannedModal(paddedId);
                } else {
                    await loadQuestionForMarker(paddedId);
                }
            });

            container.appendChild(entity);
        }

        async function loadQuestionForMarker(markerId) {
            const { data: questions, error } = await supabaseClient.from('trivia_questions').select('*').order('id', { ascending: true });
            if (error || !questions || questions.length === 0) {
                alert("Error loading questions from database.");
                processingLock = false;
                return;
            }

            // Maps marker_01 -> Q1, marker_02 -> Q2, etc.
            const questionIndex = (parseInt(markerId, 10) - 1) % questions.length;
            currentQuestion = questions[questionIndex];

            document.getElementById('markerBadge').innerText = `🎯 marker_${markerId}`;
            document.getElementById('questionText').innerText = currentQuestion.question;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const options = typeof currentQuestion.options === 'string' ? JSON.parse(currentQuestion.options) : currentQuestion.options;

            options.forEach((optText, index) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.onclick = () => submitAnswer(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quizBody').style.display = "block";
            document.getElementById('resultBody').style.display = "none";
            document.getElementById('quizModal').style.display = "block";
        }

        async function submitAnswer(selectedIndex) {
            const isCorrect = (selectedIndex === currentQuestion.correct_option);

            const { data, error } = await supabaseClient.rpc('process_trivia_answer', {
                p_team_id: teamId,
                p_marker_id: activeMarkerId,
                p_is_correct: isCorrect
            });

            document.getElementById('quizBody').style.display = "none";
            document.getElementById('resultBody').style.display = "block";

            if (error) {
                document.getElementById('resultTitle').innerText = "System Error";
                document.getElementById('resultTitle').className = "error-text";
                document.getElementById('resultMessage').innerText = error.message || "Failed to submit answer.";
            } else {
                const res = Array.isArray(data) ? data[0] : data;
                refreshHUD();

                // Check if all 20 markers are complete
                if (res && res.total_scanned >= 20) {
                    document.getElementById('resultTitle').innerText = "🏆 QUEST COMPLETE!";
                    document.getElementById('resultTitle').className = "success-text";
                    document.getElementById('resultMessage').innerText = "All Markers Scanned, Please go back to Base. 🏁🚩";
                } else {
                    document.getElementById('resultTitle').innerText = isCorrect ? "🎉 Correct!" : "💡 Nice Effort!";
                    document.getElementById('resultTitle').className = isCorrect ? "success-text" : "error-text";
                    document.getElementById('resultMessage').innerText = res ? res.message : (isCorrect ? "+10 Points!" : "+5 Points!");
                }
            }
        }

        function showAlreadyScannedModal(markerId) {
            document.getElementById('markerBadge').innerText = `🎯 marker_${markerId}`;
            document.getElementById('quizBody').style.display = "none";
            document.getElementById('resultBody').style.display = "block";
            document.getElementById('resultTitle').innerText = "Already Answered!";
            document.getElementById('resultTitle').className = "error-text";
            document.getElementById('resultMessage').innerText = "Your team has already scanned this marker.";
            document.getElementById('quizModal').style.display = "block";
        }

        async function refreshHUD() {
            const { data } = await supabaseClient.from('teams').select('score, scanned_count').eq('team_id', teamId).maybeSingle();
            if (data) {
                document.getElementById('score-display').innerText = `Points: ${data.score || 0}`;
                document.getElementById('progress-display').innerText = `Markers: ${data.scanned_count || 0}/20`;
            }
        }

        function closeModal() {
            document.getElementById('quizModal').style.display = "none";
            setTimeout(() => { processingLock = false; }, 2000);
        }
    </script>
</body>
</html>
