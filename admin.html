<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #162447;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1f4068;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        h1 { text-align: center; color: #ffc107; margin-bottom: 20px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #1f4068;
        }
        th { background-color: #0f4c75; color: #00d2fc; }
        tr:nth-child(even) { background-color: rgba(255,255,255,0.05); }
        .refresh-btn {
            background: #e43f5a; color: white; border: none; padding: 10px 20px;
            font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;
            width: 100%; margin-top: 15px;
        }
        .refresh-btn:hover { background: #d0354d; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📊 Live Leaderboard</h1>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Team Name</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr><td colspan="3" style="text-align:center;">Loading scores...</td></tr>
            </tbody>
        </table>
        <button class="refresh-btn" onclick="fetchScores()">🔄 Refresh Leaderboard</button>
    </div>

    <script>
        // Use raw GitHub content URL or API to bypass caching
        const RAW_JSON_URL = "https://raw.githubusercontent.com/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME/main/scores.json";

        async function fetchScores() {
            const body = document.getElementById('leaderboard-body');
            try {
                // Fetch scores with a cache-busting timestamp
                const res = await fetch(`${RAW_JSON_URL}?t=${new Date().getTime()}`);
                const data = await res.json();
                
                const teams = data.teams || {};
                
                // Sort teams by highest score
                const sorted = Object.entries(teams).sort((a, b) => b[1] - a[1]);

                if (sorted.length === 0) {
                    body.innerHTML = '<tr><td colspan="3" style="text-align:center;">No teams logged in yet.</td></tr>';
                    return;
                }

                body.innerHTML = sorted.map(([team, score], idx) => `
                    <tr>
                        <td><strong>#${idx + 1}</strong></td>
                        <td>${team}</td>
                        <td><span style="color: #4dff88; font-weight: bold;">${score} pts</span></td>
                    </tr>
                `).join('');

            } catch (err) {
                body.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#ff4d4d;">Failed to load leaderboard data.</td></tr>';
            }
        }

        // Auto-refresh every 5 seconds
        fetchScores();
        setInterval(fetchScores, 5000);
    </script>
</body>
</html>
