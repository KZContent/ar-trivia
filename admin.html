<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AR Trivia Quest</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0; padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .reset-btn {
            background: #e11d48;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th { background: #334155; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏴‍☠️ Game Control & Leaderboard</h2>
        <button class="reset-btn" onclick="resetGame()">Reset Entire Game</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Team Name</th>
                <th>Score</th>
                <th>Markers Cleared</th>
            </tr>
        </thead>
        <tbody id="leaderboardBody">
            <tr><td colspan="4">Loading leaderboard...</td></tr>
        </tbody>
    </table>

    <script>
        const SUPABASE_URL = "https://vkdilynwfkkmmmjiyxyw.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrZGlseW53ZmtrbW1taml5eHl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDA5NDUsImV4cCI6MjA5Nzk3Njk0NX0.AY267mdl4i6fcJuqNx1J3ANs-mNRHcydZvwD75OuAA0";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchLeaderboard() {
            const { data: teams } = await supabaseClient
                .from('teams')
                .select('*')
                .order('score', { ascending: false });

            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            if (!teams || teams.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">No active teams registered.</td></tr>';
                return;
            }

            teams.forEach((t, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${index + 1}</td>
                    <td><strong>${t.team_name}</strong></td>
                    <td>${t.score} pts</td>
                    <td>${t.scanned_count} / 40</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function resetGame() {
            if (!confirm("Are you sure? This will wipe all teams and progress for everyone!")) return;

            await supabaseClient.from('scan_logs').delete().neq('id', 0);
            await supabaseClient.from('teams').delete().neq('team_id', 'none');
            fetchLeaderboard();
        }

        // Live Realtime Subscription
        supabaseClient
            .channel('admin-feed')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'teams' }, fetchLeaderboard)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'scan_logs' }, fetchLeaderboard)
            .subscribe();

        fetchLeaderboard();
    </script>
</body>
</html>
