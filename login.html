<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Trivia Quest - Team Registration</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #162447;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 80%;
            max-width: 350px;
        }
        h1 { color: #ffc107; margin-bottom: 20px; }
        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: #e43f5a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background: #b93246; }
        .error { color: #ff4d4d; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>🧩 AR Trivia Quest 🧩</h1>
        <p>Enter your Team Name to join the challenge!</p>
        <input type="text" id="teamNameInput" placeholder="e.g. Brainiacs" required>
        <button onclick="registerTeam()">Start Quest</button>
        <div id="errorMessage" class="error"></div>
    </div>

    <script>
        function registerTeam() {
            const teamName = document.getElementById('teamNameInput').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerText = "";

            if (!teamName) {
                errorDiv.innerText = "Please enter a valid team name!";
                return;
            }

            // Save team details & initialize local storage
            localStorage.setItem('team_name', teamName);
            if (!localStorage.getItem('team_score')) {
                localStorage.setItem('team_score', '0');
            }
            if (!localStorage.getItem('scanned_markers')) {
                localStorage.setItem('scanned_markers', JSON.stringify([]));
            }

            window.location.href = 'index.html';
        }

        // Auto-redirect if team is already registered on this device
        if (localStorage.getItem('team_name')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
