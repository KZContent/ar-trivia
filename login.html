<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Login - AR Trivia Quest</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid #38bdf8;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: #0284c7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background: #0369a1; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🏴‍☠️ AR Trivia Quest</h2>
        <p>Enter your team name to join</p>
        <input type="text" id="teamNameInput" placeholder="Team Name (e.g. Black Pearls)" maxlength="20">
        <button onclick="joinQuest()">Start Hunt</button>
    </div>

    <script>
        const SUPABASE_URL = "https://vkdilynwfkkmmmjiyxyw.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrZGlseW53ZmtrbW1taml5eHl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDA5NDUsImV4cCI6MjA5Nzk3Njk0NX0.AY267mdl4i6fcJuqNx1J3ANs-mNRHcydZvwD75OuAA0";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function joinQuest() {
            const rawName = document.getElementById('teamNameInput').value.trim();
            if (!rawName) return alert("Please enter a valid team name.");

            const teamId = rawName.toLowerCase().replace(/[^a-z0-9]/g, '-');

            // Insert team if new, or fetch existing
            const { data, error } = await supabaseClient
                .from('teams')
                .upsert({ team_id: teamId, team_name: rawName }, { onConflict: 'team_id' })
                .select()
                .single();

            if (error) {
                alert("Error joining game: " + error.message);
                return;
            }

            localStorage.setItem('team_id', data.team_id);
            localStorage.setItem('team_name', data.team_name);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
