<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Quest - Team Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 85%;
            max-width: 360px;
            border: 2px solid #e2e8f0;
        }
        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        select { background: #334155; color: #fff; border: 1px solid #475569; }
        button { background: #e11d48; color: #fff; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>🏴‍☠️ Pirate Quest</h1>
        <p>Select your team to begin!</p>
        <select id="teamSelect">
            <option value="">Loading teams...</option>
        </select>
        <button onclick="login()">Start Hunt</button>
    </div>

    <script>
        const SUPABASE_URL = "https://vkdilynwfkkmmmjiyxyw.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrZGlseW53ZmtrbW1taml5eHl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDA5NDUsImV4cCI6MjA5Nzk3Njk0NX0.AY267mdl4i6fcJuqNx1J3ANs-mNRHcydZvwD75OuAA0";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadTeams() {
            const { data: teams } = await supabaseClient.from('teams').select('*').order('team_name');
            const select = document.getElementById('teamSelect');
            select.innerHTML = '<option value="">-- Choose Team --</option>';
            if (teams) {
                teams.forEach(t => {
                    select.innerHTML += `<option value="${t.team_id}">${t.team_name}</option>`;
                });
            }
        }
        loadTeams();

        function login() {
            const select = document.getElementById('teamSelect');
            const teamId = select.value;
            const teamName = select.options[select.selectedIndex].text;

            if (!teamId) {
                alert("Please select a team!");
                return;
            }

            localStorage.setItem('team_id', teamId);
            localStorage.setItem('team_name', teamName);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
